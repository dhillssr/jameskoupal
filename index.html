<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>James Koupal — Contemporary Painter</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          serif: ['"Cormorant Garamond"', 'serif'],
        },
        colors: {
          ink: '#0a0a0a',
          paper: '#fafaf9',
          muted: '#737373',
          line: '#e7e5e4',
        },
        letterSpacing: {
          'extra': '0.22em',
        }
      }
    }
  };
</script>
<style>
  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; background: #ffffff; color: #0a0a0a; }
  .serif { font-family: 'Cormorant Garamond', serif; }
  .nav-blur { backdrop-filter: saturate(160%) blur(14px); -webkit-backdrop-filter: saturate(160%) blur(14px); background-color: rgba(255,255,255,0.72); }
  .fade-in { animation: fadeIn 0.9s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .hero-img { transition: opacity 1.2s ease; }
  .grid-img { transition: transform 1.4s ease, filter 0.6s ease; }
  .grid-card:hover .grid-img { transform: scale(1.03); }
  .grid-card:hover .grid-overlay { opacity: 1; }
  .grid-overlay { transition: opacity 0.5s ease; }
  /* Masonry */
  .masonry { column-count: 1; column-gap: 1.25rem; }
  @media (min-width: 640px) { .masonry { column-count: 2; column-gap: 1.5rem; } }
  @media (min-width: 1024px) { .masonry { column-count: 3; column-gap: 2rem; } }
  .masonry > * { break-inside: avoid; margin-bottom: 2rem; }
  .underline-hover { position: relative; }
  .underline-hover::after {
    content: ''; position: absolute; left: 0; bottom: -2px; height: 1px; width: 0; background: currentColor; transition: width 0.4s ease;
  }
  .underline-hover:hover::after { width: 100%; }
  .dot { width: 6px; height: 6px; border-radius: 9999px; background: #0a0a0a; opacity: 0.25; transition: opacity 0.3s, transform 0.3s; }
  .dot.active { opacity: 1; transform: scale(1.4); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef } = React;

// ----- Data -----
const HERO_SLIDES = [
  {
    src: 'https://images.unsplash.com/photo-1549887534-1541e9326642?w=1200&auto=format&fit=crop&q=80',
    title: 'Untitled (Quiet Field)',
    year: '2024',
    medium: 'Oil on linen, 180 × 220 cm',
  },
  {
    src: 'https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?w=1200&auto=format&fit=crop&q=80',
    title: 'Threshold',
    year: '2024',
    medium: 'Acrylic and pigment on canvas, 160 × 200 cm',
  },
  {
    src: 'https://images.unsplash.com/photo-1578321272176-b7bbc0679853?w=1200&auto=format&fit=crop&q=80',
    title: 'Memory of Sound',
    year: '2023',
    medium: 'Oil on linen, 140 × 180 cm',
  },
  {
    src: 'https://images.unsplash.com/photo-1552084117-56a987666449?w=1200&auto=format&fit=crop&q=80',
    title: 'Studies in Ochre',
    year: '2023',
    medium: 'Mixed media on paper, 90 × 120 cm',
  },
];

const GALLERY = [
  { src: 'https://images.unsplash.com/photo-1541961017774-22349e4a1262?w=1200&auto=format&fit=crop&q=80', title: 'Slow Light, No. 4', year: '2024', h: 'tall' },
  { src: 'https://images.unsplash.com/photo-1583407723467-9b2d22504831?w=1200&auto=format&fit=crop&q=80', title: 'Interior with Window', year: '2024', h: 'short' },
  { src: 'https://images.unsplash.com/photo-1617897903246-719242758050?w=1200&auto=format&fit=crop&q=80', title: 'Field Notes', year: '2023', h: 'medium' },
  { src: 'https://images.unsplash.com/photo-1574182245530-967d9b3831af?w=1200&auto=format&fit=crop&q=80', title: 'Untitled (Pale Blue)', year: '2023', h: 'tall' },
  { src: 'https://images.unsplash.com/photo-1578926375605-eaf7559b1458?w=1200&auto=format&fit=crop&q=80', title: 'Coastal Study', year: '2023', h: 'short' },
  { src: 'https://images.unsplash.com/photo-1605721911519-3dfeb3be25e7?w=1200&auto=format&fit=crop&q=80', title: 'After Rain', year: '2022', h: 'medium' },
  { src: 'https://images.unsplash.com/photo-1536924940846-227afb31e2a5?w=1200&auto=format&fit=crop&q=80', title: 'Two Forms', year: '2022', h: 'tall' },
  { src: 'https://images.unsplash.com/photo-1577720580479-7d839d829c73?w=1200&auto=format&fit=crop&q=80', title: 'White Room', year: '2022', h: 'short' },
  { src: 'https://images.unsplash.com/photo-1573521193826-58c7dc2e13e3?w=1200&auto=format&fit=crop&q=80', title: 'Composition in Grey', year: '2021', h: 'medium' },
];

const heightClass = (h) => h === 'tall' ? 'h-[520px]' : h === 'short' ? 'h-[280px]' : 'h-[400px]';

// ----- Components -----
function Nav() {
  const [scrolled, setScrolled] = useState(false);
  const [open, setOpen] = useState(false);
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 16);
    window.addEventListener('scroll', onScroll);
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  const links = [
    { href: '#works', label: 'Works' },
    { href: '#about', label: 'About' },
    { href: '#contact', label: 'Contact' },
  ];

  return (
    <header className={`fixed top-0 left-0 right-0 z-50 nav-blur transition-all duration-500 ${scrolled ? 'border-b border-line' : 'border-b border-transparent'}`}>
      <div className="max-w-[1600px] mx-auto px-6 md:px-12 flex items-center justify-between h-16 md:h-20">
        <a href="#top" className="flex items-baseline gap-3">
          <span className="serif text-xl md:text-2xl tracking-tight text-ink">James koupal</span>
          <span className="hidden md:inline text-[11px] uppercase tracking-extra text-muted">Studio · Minnesota</span>
        </a>
        <nav className="hidden md:flex items-center gap-10">
          {links.map(l => (
            <a key={l.href} href={l.href} className="underline-hover text-[12px] uppercase tracking-extra text-ink/80 hover:text-ink">{l.label}</a>
          ))}
        </nav>
        <button onClick={() => setOpen(o => !o)} className="md:hidden text-ink" aria-label="Menu">
          <i data-lucide={open ? "x" : "menu"} className="w-5 h-5"></i>
        </button>
      </div>
      {open && (
        <div className="md:hidden border-t border-line bg-white">
          <div className="px-6 py-6 flex flex-col gap-5">
            {links.map(l => (
              <a key={l.href} href={l.href} onClick={() => setOpen(false)} className="text-[13px] uppercase tracking-extra text-ink">{l.label}</a>
            ))}
          </div>
        </div>
      )}
    </header>
  );
}

function Hero() {
  const [idx, setIdx] = useState(0);
  const [paused, setPaused] = useState(false);
  useEffect(() => {
    if (paused) return;
    const t = setInterval(() => setIdx(i => (i + 1) % HERO_SLIDES.length), 6000);
    return () => clearInterval(t);
  }, [paused]);

  const go = (delta) => setIdx(i => (i + delta + HERO_SLIDES.length) % HERO_SLIDES.length);

  return (
    <section id="top" className="relative w-full h-[100svh] min-h-[640px] bg-paper overflow-hidden"
      onMouseEnter={() => setPaused(true)} onMouseLeave={() => setPaused(false)}>
      {HERO_SLIDES.map((s, i) => (
        <div key={i} className={`absolute inset-0 hero-img ${i === idx ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}>
          <img src={s.src} alt={s.title} className="w-full h-full object-cover" loading={i === 0 ? 'eager' : 'lazy'} />
          <div className="absolute inset-0 bg-gradient-to-t from-black/30 via-transparent to-black/10"></div>
        </div>
      ))}

      {/* Top-left tag */}
      <div className="absolute top-24 md:top-28 left-6 md:left-12 text-white/90 fade-in">
        <p className="text-[11px] uppercase tracking-extra">Current Exhibition</p>
        <p className="text-[13px] mt-2 max-w-xs">"Slow Light" — Pace Gallery, London. Through 14 June.</p>
      </div>

      {/* Bottom info */}
      <div className="absolute bottom-0 left-0 right-0 px-6 md:px-12 pb-10 md:pb-14">
        <div className="flex items-end justify-between gap-8 text-white">
          <div className="max-w-2xl">
            <p className="text-[11px] uppercase tracking-extra opacity-80 mb-3">{String(idx + 1).padStart(2,'0')} / {String(HERO_SLIDES.length).padStart(2,'0')}</p>
            <h1 className="serif text-4xl md:text-6xl lg:text-7xl leading-[1.05] font-light">{HERO_SLIDES[idx].title}</h1>
            <p className="mt-4 text-sm md:text-[15px] opacity-85">{HERO_SLIDES[idx].medium} · {HERO_SLIDES[idx].year}</p>
          </div>
          <div className="hidden md:flex items-center gap-3">
            <button onClick={() => go(-1)} aria-label="Previous" className="w-12 h-12 border border-white/40 rounded-full flex items-center justify-center hover:bg-white hover:text-ink transition-colors">
              <i data-lucide="arrow-left" className="w-4 h-4"></i>
            </button>
            <button onClick={() => go(1)} aria-label="Next" className="w-12 h-12 border border-white/40 rounded-full flex items-center justify-center hover:bg-white hover:text-ink transition-colors">
              <i data-lucide="arrow-right" className="w-4 h-4"></i>
            </button>
          </div>
        </div>

        {/* Dots */}
        <div className="mt-8 flex items-center gap-2.5">
          {HERO_SLIDES.map((_, i) => (
            <button key={i} aria-label={`Slide ${i+1}`} onClick={() => setIdx(i)} className={`dot ${i === idx ? 'active' : ''}`} style={{ background: '#fff' }}></button>
          ))}
        </div>
      </div>
    </section>
  );
}

function Intro() {
  return (
    <section className="max-w-[1400px] mx-auto px-6 md:px-12 py-28 md:py-40">
      <div className="grid md:grid-cols-12 gap-10">
        <div className="md:col-span-3">
          <p className="text-[11px] uppercase tracking-extra text-muted">— Statement</p>
        </div>
        <div className="md:col-span-9">
          <p className="serif text-3xl md:text-5xl leading-[1.2] font-light text-ink" style={{ textWrap: 'balance' }}>
            A practice concerned with quiet observation — the pause between things, the residue of light on a wall at the end of a long afternoon.
          </p>
        </div>
      </div>
    </section>
  );
}

function Works() {
  return (
    <section id="works" className="max-w-[1600px] mx-auto px-6 md:px-12 pb-24">
      <div className="flex items-end justify-between mb-12 md:mb-16">
        <div>
          <p className="text-[11px] uppercase tracking-extra text-muted mb-3">— Selected Works</p>
          <h2 className="serif text-3xl md:text-5xl font-light">Recent Paintings</h2>
        </div>
        <a href="#contact" className="hidden md:inline-block underline-hover text-[12px] uppercase tracking-extra text-ink">Inquire</a>
      </div>

      <div className="masonry">
        {GALLERY.map((g, i) => (
          <figure key={i} className="grid-card group cursor-pointer">
            <div className={`relative overflow-hidden bg-paper ${heightClass(g.h)}`}>
              <img src={g.src} alt={g.title} className="grid-img w-full h-full object-cover" loading="lazy" />
              <div className="grid-overlay absolute inset-0 bg-black/15 opacity-0"></div>
            </div>
            <figcaption className="mt-4 flex items-baseline justify-between gap-4">
              <span className="serif text-lg italic text-ink">{g.title}</span>
              <span className="text-[11px] uppercase tracking-extra text-muted">{g.year}</span>
            </figcaption>
          </figure>
        ))}
      </div>
    </section>
  );
}

function About() {
  return (
    <section id="about" className="bg-paper">
      <div className="max-w-[1400px] mx-auto px-6 md:px-12 py-28 md:py-40">
        <div className="grid md:grid-cols-12 gap-10 md:gap-20 items-start">
          <div className="md:col-span-5">
            <div className="aspect-[4/5] w-full overflow-hidden bg-line">
              <img
                src="img/JamesK2.png"
                alt="Portrait of James Koupal"
                className="w-full h-full object-cover"
                loading="lazy"
              />
            </div>
            <p className="mt-4 text-[11px] uppercase tracking-extra text-muted">Portrait by Dwayne Hills, 2026</p>
          </div>

          <div className="md:col-span-7 md:pt-6">
            <p className="text-[11px] uppercase tracking-extra text-muted mb-5">— About</p>
            <h2 className="serif text-4xl md:text-6xl font-light leading-[1.05] mb-10" style={{ textWrap: 'balance' }}>
              Working slowly, between the studio and the coast.
            </h2>
            <div className="space-y-5 text-[15px] leading-[1.75] text-ink/85 max-w-xl">
              <p>
                James Koupal (b. 1981, Bristol) is a painter living and working between London and the North Devon coast. His work is concerned with the long, observational gesture — atmosphere, surface, the slow accumulation of a single color across a season.
              </p>
              <p>
                Hollister studied painting at the Royal College of Art and held early residencies at the British School at Rome and Skowhegan. His paintings have entered the collections of the Tate, the Whitworth, and the Yale Center for British Art.
              </p>
              <p>
                Recent solo exhibitions include "Slow Light" (Pace, London, 2026), "Field Notes" (Modern Art, 2024), and "Threshold" (David Kordansky, Los Angeles, 2023).
              </p>
            </div>

            <div className="mt-12 grid grid-cols-2 gap-x-8 gap-y-3 max-w-md text-[13px]">
              <div className="text-muted uppercase tracking-extra text-[10px]">Born</div>
              <div className="text-ink">1981, Bristol, UK</div>
              <div className="text-muted uppercase tracking-extra text-[10px]">Lives</div>
              <div className="text-ink">London / North Devon</div>
              <div className="text-muted uppercase tracking-extra text-[10px]">Education</div>
              <div className="text-ink">Royal College of Art, MA</div>
              <div className="text-muted uppercase tracking-extra text-[10px]">Represented by</div>
              <div className="text-ink">Pace Gallery</div>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}


function Contact() {
  return (
    <footer id="contact" className="border-t border-line">
      <div className="max-w-[1400px] mx-auto px-6 md:px-12 py-24 md:py-32">
        <div className="grid md:grid-cols-12 gap-10">
          <div className="md:col-span-6">
            <p className="text-[11px] uppercase tracking-extra text-muted mb-5">— Contact</p>
            <h3 className="serif text-4xl md:text-6xl font-light leading-[1.05]" style={{ textWrap: 'balance' }}>
              For studio visits and acquisitions.
            </h3>
            <a href="mailto:studio@jameskoupal.com" className="inline-block mt-8 underline-hover serif italic text-2xl md:text-3xl text-ink">
              studio@jameskoupal.com
            </a>
          </div>
          <div className="md:col-span-6 md:pl-10 flex flex-col justify-between">
            <div>
              <p className="text-[11px] uppercase tracking-extra text-muted mb-4">Studio</p>
              <p className="text-[15px] leading-relaxed text-ink/85">
                Unit 14, Bow Arts Trust<br/>
                183 Bow Road, London E3 2SJ<br/>
                Visits by appointment.
              </p>
              <p className="mt-8 text-[11px] uppercase tracking-extra text-muted mb-4">Representation</p>
              <p className="text-[15px] text-ink/85">Pace Gallery — <a href="#" className="underline-hover">pacegallery.com</a></p>
            </div>
            <div className="mt-12 flex items-center gap-5">
              <a href="#" aria-label="Instagram" className="w-10 h-10 border border-line rounded-full flex items-center justify-center hover:bg-ink hover:text-white hover:border-ink transition-colors">
                <i data-lucide="instagram" className="w-4 h-4"></i>
              </a>
              <a href="#" aria-label="X" className="w-10 h-10 border border-line rounded-full flex items-center justify-center hover:bg-ink hover:text-white hover:border-ink transition-colors">
                <i data-lucide="twitter" className="w-4 h-4"></i>
              </a>
              <a href="#" aria-label="Vimeo" className="w-10 h-10 border border-line rounded-full flex items-center justify-center hover:bg-ink hover:text-white hover:border-ink transition-colors">
                <i data-lucide="video" className="w-4 h-4"></i>
              </a>
              <a href="mailto:studio@jameskoupal.com" aria-label="Email" className="w-10 h-10 border border-line rounded-full flex items-center justify-center hover:bg-ink hover:text-white hover:border-ink transition-colors">
                <i data-lucide="mail" className="w-4 h-4"></i>
              </a>
            </div>
          </div>
        </div>

        <div className="mt-20 pt-8 border-t border-line flex flex-col md:flex-row items-start md:items-center justify-between gap-4 text-[11px] uppercase tracking-extra text-muted">
          <span>© 2026 James Koupal. All works and images.</span>
          <span>Site by Studio Koupal</span>
        </div>
      </div>
    </footer>
  );
}

function App() {
  useEffect(() => {
    const render = () => { if (window.lucide) window.lucide.createIcons(); };
    render();
    const obs = new MutationObserver(render);
    obs.observe(document.body, { childList: true, subtree: true });
    return () => obs.disconnect();
  }, []);

  return (
    <div className="bg-white text-ink">
      <Nav />
      <Hero />
      <Intro />
      <Works />
      <About />
      <Contact />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
